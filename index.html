<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة أحلى بارت 🏆</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 { color: #f39c12; margin-bottom: 10px; }
        p { color: #ddd; margin-bottom: 20px; font-size: 14px; }
        .candidate-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .candidate-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: right;
            flex-grow: 1;
        }
        .candidate-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f39c12;
        }
        .candidate-details {
            flex-grow: 1;
        }
        .candidate-details h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        audio {
            width: 100%;
            height: 32px;
        }
        .vote-btn {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            margin-right: 10px;
        }
        .vote-btn:hover { background: #e67e22; }
        .vote-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .msg { margin-top: 15px; font-weight: bold; color: #2ecc71; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 مسابقة أحلى بارت</h1>
    <p>استمع للبارتات وصوت لأفضل بارت (يحق لك التصويت مرة واحدة فقط)</p>
    
    <div id="candidates-list">
        <!-- دحوم -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="dahoom.jpg" alt="دحوم">
                <div class="candidate-details">
                    <h3>دحوم</h3>
                    <audio controls src="dahoom.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('دحوم')">صوت</button>
        </div>

        <!-- حربي -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="harbi.jpg" alt="حربي">
                <div class="candidate-details">
                    <h3>حربي</h3>
                    <audio controls src="harbi.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('حربي')">صوت</button>
        </div>

        <!-- حسون -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="hassoon.jpg" alt="حسون">
                <div class="candidate-details">
                    <h3>حسون</h3>
                    <audio controls src="hassoon.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('حسون')">صوت</button>
        </div>

        <!-- خليفه -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="khalifa.jpg" alt="خليفه">
                <div class="candidate-details">
                    <h3>خليفه</h3>
                    <audio controls src="khalifa.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('خليفه')">صوت</button>
        </div>

        <!-- شاهين -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="shahin.jpg" alt="شاهين">
                <div class="candidate-details">
                    <h3>شاهين</h3>
                    <audio controls src="shahin.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('شاهين')">صوت</button>
        </div>

        <!-- يوسف جبر -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="yousef.jpg" alt="يوسف جبر">
                <div class="candidate-details">
                    <h3>يوسف جبر</h3>
                    <audio controls src="yousef.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('يوسف جبر')">صوت</button>
        </div>

        <!-- زيد الخالدي -->
        <div class="candidate-card">
            <div class="candidate-info">
                <img src="zaid.jpg" alt="زيد الخالدي">
                <div class="candidate-details">
                    <h3>زيد الخالدي</h3>
                    <audio controls src="zaid.mp3"></audio>
                </div>
            </div>
            <button class="vote-btn" onclick="vote('زيد الخالدي')">صوت</button>
        </div>
    </div>

    <div id="status-msg" class="msg"></div>
</div>

<script>
    // عند تحميل الصفحة: نسمح للجميع بالدخول والاستماع للمقاطع بحرية
    window.addEventListener('DOMContentLoaded', () => {
        const hasVoted = localStorage.getItem('hasVoted');
        if (hasVoted) {
            lockVotingButtons('لقد قمت بالتصويت من قبل. يمكنك الاستماع للمقاطع متى شئت، ولكن لا يمكنك التصويت مرة أخرى.');
        }
    });

    function vote(candidateName) {
        const hasVoted = localStorage.getItem('hasVoted');
        
        if (hasVoted) {
            alert('عفواً، لقد قمت بالتصويت مسبقاً ولا يمكنك التصويت أكثر من مرة!');
            return;
        }

        // حفظ حالة التصويت في متصفح المستخدم
        localStorage.setItem('hasVoted', 'true');
        localStorage.setItem('myVote', candidateName);

        // تعطيل أزرار التصويت وإظهار رسالة النجاح
        lockVotingButtons('تم تسجيل صوتك لـ ' + candidateName + ' بنجاح! شكراً لك.');
        alert('تم تسجيل صوتك بنجاح لـ ' + candidateName);
    }

    function lockVotingButtons(message) {
        const buttons = document.querySelectorAll('.vote-btn');
        buttons.forEach(btn => {
            btn.disabled = true;
            btn.textContent = 'تم التصويت';
        });
        document.getElementById('status-msg').textContent = message;
    }
</script>
</body>
</html>
